[package]
name = "rs-typing-trainer"
version = "0.1.0"
edition = "2024"
description = "Terminal-based typing trainer with detailed metrics"
license = "MIT"
repository = "https://github.com/akitenkrad/rs-typing-trainer"
exclude = ["tools/"]

[dependencies]
clap = { version = "4", features = ["derive"] }
ratatui = "0.30"
unicode-segmentation = "1.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
toml_edit = "0.22"
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
color-eyre = "0.6"
dirs = "5.0"
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
rusqlite = { version = "0.31", features = ["bundled"] }
unicode-width = "0.2"

[dev-dependencies]
proptest = "1.5"
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
