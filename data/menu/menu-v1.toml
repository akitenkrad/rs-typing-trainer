version = "menu-v1"

[[fixed_step]]
role = "warmup"
id = "fixed.warmup"
title = { en = "Warm-up", ja = "ウォームアップ" }
mode = "words"
minutes = 2
settings = { "pacer.enabled" = false, "gate.min_accuracy" = 0.0 }
focus = { en = "Start with familiar words and favor clean keystrokes over speed.", ja = "よく打つ単語で，速さより正確な打鍵を優先する" }

[[fixed_step]]
role = "check"
id = "fixed.check"
title = { en = "Unassisted check", ja = "補助なしの確認" }
mode = "sentence"
minutes = 3
settings = { "session.preview_items" = 1, "pacer.enabled" = false }
focus = { en = "Keep the same technique without training aids.", ja = "補助がなくても同じ打ち方を保つ" }

[[fixed_step]]
role = "finish"
id = "fixed.finish"
title = { en = "Finish with three bursts", ja = "バースト 3 本で仕上げ" }
mode = "burst"
minutes = 1
settings = { "pacer.enabled" = false }
focus = { en = "Stay relaxed through three short bursts.", ja = "力を抜いたまま短いバーストを 3 本打つ" }

[[prescription]]
id = "accuracy.gate"
component = "accuracy"
title = { en = "Accuracy gate", ja = "正確さの関門" }
evidence = "medium"
evidence_note = { en = "Prioritizes accuracy before adding speed.", ja = "速さを積む前に正確さを優先する" }
alternate = "accuracy.anticipation"

[[prescription.level]]
mode = "words"
minutes = 4
settings = { "session.error_mode" = "stop", "gate.min_accuracy" = 0.97, "pacer.enabled" = false }
focus = { en = "Give up speed and make every keystroke certain; pause briefly after an error.", ja = "速さを捨て，1 打ずつ確実に．誤打したら 1 拍置く" }
advance = { metric = "accuracy-gate-passed", rule = "gate-passed", sessions = 3, source = "step", note = { en = "Pass the accuracy gate three sessions in a row.", ja = "関門を 3 回続けて通る" } }

[[prescription.level]]
mode = "words"
minutes = 4
